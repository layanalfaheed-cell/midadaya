<!doctype html>
<html>
  <body>
    <!-- Build-time registration for Netlify Forms; the React app submits these via fetch. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="name" />
      <input name="email" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
    <form name="review-question" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="review-question" />
      <textarea name="question"></textarea>
      <input name="lang" />
      <input name="email" />
      <input name="subject" />
      <input name="bot-field" />
    </form>
  </body>
</html>
